<!doctype html>
<!-- Bu dosya scripts/build-single.js ile üretildi; doğrudan düzenlemeyin. Kaynak: src/ ve assets/ -->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muhasebe Formları Prototipi</title>
    <meta name="description" content="Cari Form ve Yeni Talent Form için gereksinim doğrulama prototipi ve geliştirme promptu üretici" />
    <style>
/* Muhasebe Formları Prototipi — sade, kurumsal arayüz */

:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #d9dde3;
  --border-strong: #b8bfc9;
  --text: #1c2430;
  --muted: #5b6573;
  --primary: #1f5fbf;
  --primary-dark: #174a96;
  --primary-soft: #e8f0fc;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --warn: #8a5300;
  --warn-soft: #fff4e0;
  --ok: #17733a;
  --ok-soft: #e7f5ec;
  --purple: #6b3fa0;
  --purple-soft: #f1ebf9;
  --teal: #0f6b6b;
  --teal-soft: #e3f4f4;
  --gray-soft: #eceff3;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  --focus: 0 0 0 3px rgba(31, 95, 191, 0.35);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 0.5rem; }
p { margin: 0 0 0.5rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); }

.skip-link { position: absolute; left: -9999px; top: 0; background: var(--surface); padding: 8px 12px; z-index: 100; }
.skip-link:focus { left: 8px; top: 8px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1320px; margin: 0 auto; padding: 0 16px 48px; }

/* Üst çubuk */
.topbar { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 16px 0 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.25rem; margin: 0; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.banner { padding: 10px 14px; border-radius: var(--radius); margin-bottom: 12px; }
.banner-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #f1d39a; }

/* Form seçici */
.form-switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.form-tab { position: relative; text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 12px 16px; cursor: pointer; box-shadow: var(--shadow); }
.form-tab:hover { border-color: var(--border-strong); }
.form-tab.active { border-color: var(--primary); background: var(--primary-soft); }
.form-tab-title { display: block; font-weight: 700; font-size: 1.05rem; }
.form-tab-sub { display: block; color: var(--muted); font-size: 0.85rem; }
.dot { position: absolute; top: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; }
.dot-red { background: var(--danger); }
.dot-amber { background: #d18a00; }
.dot-green { background: var(--ok); }

/* Sekmeler */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-count { margin-left: 6px; font-size: 0.75rem; background: var(--gray-soft); color: var(--muted); border-radius: 999px; padding: 1px 7px; font-weight: 600; }

/* Düğmeler */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { padding: 4px 10px; font-size: 0.85rem; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger-ghost { color: var(--danger); border-color: transparent; background: none; }
.btn-danger-ghost:hover { background: var(--danger-soft); }
.btn-ghost { background: none; border-color: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn .count { background: rgba(0, 0, 0, 0.08); border-radius: 999px; padding: 0 6px; font-size: 0.75rem; }
.btn-tone-green { border-color: #a8d5b8; }
.btn-tone-blue { border-color: #a9c4ee; }
.btn-tone-purple { border-color: #cbb5e6; }
.btn-tone-amber { border-color: #ecc77d; }
.btn-tone-red { border-color: #eba59f; }
.linklike { background: none; border: none; padding: 0; color: var(--primary); text-decoration: underline; cursor: pointer; text-align: left; }
.icon-btn { background: none; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Rozetler ve çipler */
.badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.badge-green { background: var(--ok-soft); color: var(--ok); }
.badge-blue { background: var(--primary-soft); color: var(--primary-dark); }
.badge-purple { background: var(--purple-soft); color: var(--purple); }
.badge-amber { background: var(--warn-soft); color: var(--warn); }
.badge-gray { background: var(--gray-soft); color: var(--muted); }
.badge-red { background: var(--danger-soft); color: var(--danger); }
.badge-teal { background: var(--teal-soft); color: var(--teal); }
.chip { display: inline-block; font-size: 0.75rem; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); margin-right: 4px; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.chip-source { cursor: default; font-family: inherit; }
.chip-req:hover, .chip:hover { border-color: var(--primary); color: var(--primary); }
.req-link { background: none; border: 1px solid #ecc77d; border-radius: 4px; color: var(--warn); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; padding: 0 6px; cursor: pointer; }

/* Test görünümü */
.test-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 16px; }
.toolbar-label { font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
.switch input { width: 16px; height: 16px; }
.test-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.test-layout.notes-hidden { grid-template-columns: minmax(0, 760px); justify-content: center; }
.form-card { background: var(--surface); border: 1px solid var(--border); border-top: 8px solid var(--primary); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px; }
.form-header { border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
.form-title { font-size: 1.6rem; font-weight: 500; }
.strong { font-weight: 700; }
.notice-list { margin: 0 0 8px; padding-left: 20px; }
.notice-list li { margin-bottom: 4px; }
.req-legend { color: var(--danger); font-size: 0.9rem; margin: 8px 0 0; }
.req { color: var(--danger); }
.note { font-size: 0.85rem; border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
.note-amber { background: var(--warn-soft); color: #5c3a00; border-left: 3px solid #d18a00; }
.note-blue { background: var(--primary-soft); color: var(--primary-dark); border-left: 3px solid var(--primary); }

.stepper-wrap { margin-bottom: 16px; }
.step-count { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.step { display: flex; }
.step-btn, .step.pending { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 0.82rem; cursor: pointer; }
.step-btn:disabled { cursor: not-allowed; opacity: 0.55; }
.step-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--gray-soft); font-weight: 700; font-size: 0.75rem; }
.step.done .step-num { background: var(--ok-soft); color: var(--ok); }
.step.current .step-btn { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.step.current .step-num { background: var(--primary); color: #fff; }
.step.pending { border-style: dashed; color: var(--muted); cursor: default; }
.branch-chip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--teal-soft); color: var(--teal); border-radius: 6px; padding: 6px 10px; margin-bottom: 16px; font-size: 0.9rem; }

.error-summary { border: 2px solid var(--danger); background: var(--danger-soft); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
.error-summary h3 { color: var(--danger); font-size: 1rem; }
.error-summary ul { margin: 0; padding-left: 20px; }
.error-summary a { color: var(--danger); }

.section-head { margin-bottom: 8px; }
.page-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
.section-title { font-size: 1.2rem; }
.meta-note { font-size: 0.8rem; color: var(--muted); font-style: italic; }
.meta-note.inline { display: inline; margin-left: 4px; }
.field-group { margin-bottom: 8px; }
.group-title { font-size: 0.95rem; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 18px 0 10px; }

.question { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px; background: var(--surface); transition: background-color 0.3s; }
fieldset.question { min-width: 0; }
.question.invalid { border-color: var(--danger); }
.question.proposed { border-style: dashed; border-color: #cbb5e6; }
.question.added { border-left: 4px solid var(--primary); }
.question.highlight { background: #fffbe6; }
.question { position: relative; }
.question-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.question-head.floating { position: absolute; top: 12px; right: 14px; }
fieldset.question > legend { padding-right: 56px; }
.question-label, .question legend { font-weight: 600; padding: 0; }
.question legend { float: left; width: 100%; margin-bottom: 4px; }
fieldset.question > :not(legend) { clear: both; }
.question-help { color: var(--muted); font-size: 0.9rem; margin: 2px 0 8px; }
.note-btn { flex: none; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-size: 0.75rem; padding: 1px 8px; cursor: pointer; }
.note-btn:hover { color: var(--primary); border-color: var(--primary); }
.field-meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0 8px; }
.input, .ctl select, .ctl textarea, .dialog-form input[type='text'], .dialog-form textarea, .dialog-form select { width: 100%; max-width: 100%; border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.question .input { max-width: 480px; }
.question .input[aria-invalid='true'] { border-color: var(--danger); }
textarea { resize: vertical; }
.radio-group { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.radio input { width: 18px; height: 18px; }
.file-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.file-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-input:focus-visible + .file-name, .file-row:focus-within .file-btn { box-shadow: var(--focus); }
.file-btn { cursor: pointer; }
.file-name { font-size: 0.9rem; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.field-error { color: var(--danger); font-size: 0.88rem; margin: 6px 0 0; font-weight: 600; }
.field-error::before { content: '⚠ '; }
.field-warning { color: #5c3a00; background: var(--warn-soft); font-size: 0.82rem; margin: 6px 0 0; padding: 4px 8px; border-radius: 4px; }

.branch-question legend { font-size: 1.1rem; }
.branch-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
.branch-card { position: relative; display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; background: var(--surface-2); }
.branch-card:hover { border-color: var(--border-strong); }
.branch-card.selected { border-color: var(--primary); background: var(--primary-soft); }
.branch-card input { position: absolute; top: 16px; right: 16px; width: 18px; height: 18px; }
.branch-card-title { font-weight: 700; font-size: 1.05rem; padding-right: 28px; }
.branch-card-hint { font-size: 0.8rem; color: var(--muted); }

.nav-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 8px; flex-wrap: wrap; }

.review-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
.review-block.missing { border-style: dashed; color: var(--muted); }
.review-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.review-head h4 { margin: 0; font-size: 0.95rem; }
.review-list { display: grid; grid-template-columns: minmax(140px, 40%) 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 0.9rem; }
.review-list dt { color: var(--muted); }
.review-list dd { margin: 0; word-break: break-word; }
.success-panel { border: 2px solid var(--ok); background: var(--ok-soft); border-radius: var(--radius); padding: 16px; }
.success-panel h3 { color: var(--ok); }

/* Not paneli */
.notes-col { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.notes { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.notes-title { font-size: 1rem; margin: 0; }
.notes-sub { color: var(--muted); font-size: 0.85rem; }
.notes-box { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; font-size: 0.88rem; }
.notes-box h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
.active-branch { background: var(--teal-soft); border-radius: 4px; padding: 2px 6px; }
.mini-list { padding-left: 18px; margin: 0 0 8px; font-size: 0.88rem; }
.mini-list li { margin-bottom: 4px; }

/* Liste görünümleri */
.view-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.view-head h2 { font-size: 1.25rem; }
.subhead { font-size: 1rem; margin: 20px 0 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; }
.filters .ctl { min-width: 160px; }
.ctl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.filters .ctl { margin-bottom: 0; }
.ctl label { font-weight: 600; font-size: 0.88rem; }
.ctl-hint { font-size: 0.8rem; color: var(--muted); margin: 0; }
.ctl.grow { flex: 1; }
.status-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.card-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); }
.card-list.compact .card { box-shadow: none; }
.card-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.card h4 { font-size: 1rem; }
.card-target { font-size: 0.85rem; color: var(--muted); }
.expected { background: var(--surface-2); border-radius: 4px; padding: 6px 10px; font-size: 0.9rem; }
.empty { background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 20px; text-align: center; color: var(--muted); }
.req-card { border-left: 4px solid var(--border-strong); }
.req-card.tone-green { border-left-color: var(--ok); }
.req-card.tone-blue { border-left-color: var(--primary); }
.req-card.tone-purple { border-left-color: var(--purple); }
.req-card.tone-amber { border-left-color: #d18a00; }
.req-card.tone-red { border-left-color: var(--danger); }
.req-desc { font-size: 0.95rem; }
.req-source { font-size: 0.82rem; color: var(--muted); }
.open-q { color: #5c3a00; }
.req-controls { display: grid; grid-template-columns: 240px 1fr; gap: 12px; margin-top: 8px; }
.quote { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--border-strong); background: var(--surface-2); white-space: pre-wrap; }

/* Prompt */
.ready-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.ready-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.ready-card.active { border: 2px solid var(--primary); }
.ready-card h3 { margin: 0; font-size: 1.05rem; }
.ready-stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 0.88rem; margin: 8px 0; }
.ready-stats dt { color: var(--muted); }
.ready-stats dd { margin: 0; font-weight: 700; text-align: right; }
.ready-stats dd.bad { color: var(--danger); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.panel h3 { font-size: 1.05rem; }
.panel-red { border-color: #eba59f; background: #fffafa; }
.ok-text { color: var(--ok); font-weight: 600; }
.error-text { color: var(--danger); font-weight: 600; }
.warn-text { color: var(--warn); font-weight: 600; }
.warn-list { max-height: 200px; overflow: auto; font-size: 0.85rem; }
.final-list { display: flex; flex-direction: column; gap: 12px; }
.final-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.final-item h3 { margin: 0; font-size: 1rem; }
.prompt-text { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; line-height: 1.45; border: 1px solid var(--border-strong); border-radius: 6px; padding: 12px; margin-top: 8px; background: #fcfcfd; }

/* Diyalog */
.dialog { border: none; border-radius: 10px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 50px rgba(16, 24, 40, 0.3); }
.dialog-wide { width: min(780px, calc(100vw - 32px)); }
.dialog::backdrop { background: rgba(16, 24, 40, 0.45); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dialog-head h2 { margin: 0; font-size: 1.1rem; }
.dialog-body { padding: 16px 18px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); }
.dialog-form .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-errors p { color: var(--danger); font-weight: 600; margin: 0 0 6px; }
.subpanel { border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
.radio-group-inline { border: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.radio-group-inline legend { font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; }
.help-list li { margin-bottom: 8px; }

/* Bildirim */
.toast-region { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: #1c2430; color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: var(--shadow); font-size: 0.9rem; }
.toast-success { background: var(--ok); }
.toast-error { background: var(--danger); }
.toast-warn { background: #8a5300; }

/* Duyarlı yerleşim */
@media (max-width: 980px) {
  .test-layout { grid-template-columns: minmax(0, 1fr); }
  .notes-col { position: static; max-height: none; }
}
@media (max-width: 640px) {
  .form-switch, .ready-grid, .branch-cards, .dialog-form .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .form-card { padding: 16px; }
  .req-controls { grid-template-columns: minmax(0, 1fr); }
  .review-list { grid-template-columns: minmax(0, 1fr); }
  .review-list dd { margin-bottom: 6px; }
  .filters .ctl { min-width: 0; flex: 1 1 140px; }
}

    button('Bu adım için not ekle', () => openFeedbackDialog(app, { form: app.formId, branch: fs.answers.branch || 'all', target: step && step.id !== 'yon' ? `section:${step.id}` : 'section:yon' }), { small: true, id: 'btn-step-feedback' }),
    h(
      'label',
      { class: 'switch', for: notesId },
      h('input', {
        type: 'checkbox',
        id: notesId,
        checked: fs.ui.showNotes !== false,
        onchange: (e) => app.commit(() => {
          fs.ui.showNotes = e.target.checked;
        }),
      }),
      ' Test notlarını göster',
    ),
  );
}

function fillSample(app) {
  const form = app.form;
  const fs = app.fs;
  if (form.hasBranches && !fs.answers.branch) {
    toast('Önce fatura yönünü seçin; örnek veri seçilen yöne göre doldurulur.', 'warn');
    return;
  }
  app.commit(() => {
    Object.assign(fs.answers.values, form.sampleAnswers.common);
    if (form.sampleAnswers.byBranch && fs.answers.branch) Object.assign(fs.answers.values, form.sampleAnswers.byBranch[fs.answers.branch]);
    for (const [id, meta] of Object.entries(form.sampleAnswers.files || {})) fs.answers.files[id] = { ...meta };
    app.transient.submitted[app.formId] = null;
  });
  toast('ÖRNEK veri dolduruldu. Bu veriler sahtedir ve kaynak belgelerden alınmamıştır.', 'success');
}

async function resetScenario(app) {
  const ok = await confirmDialog({ title: 'Senaryoyu sıfırla', message: 'Bu formdaki test yanıtları, adım ilerlemesi ve simülasyon anahtarları sıfırlanır. Geri bildirimler, kararlar ve gereksinim durumları korunur.', confirmText: 'Sıfırla', danger: true });
  if (!ok) return;
  app.transient.attempted[app.formId] = {};
  app.transient.submitted[app.formId] = null;
  app.commit(() => {
    const fs = app.fs;
    fs.answers = { branch: null, values: {}, files: {} };
    fs.ui.step = app.form.hasBranches ? 'yon' : 't1';
    fs.ui.visited = {};
  });
  toast('Test senaryosu sıfırlandı.');
}

async function clearForm(app) {
  const ok = await confirmDialog({ title: 'Formu temizle', message: 'Bu formdaki tüm yanıtlar silinsin mi?', confirmText: 'Formu temizle', danger: true });
  if (!ok) return;
  app.transient.attempted[app.formId] = {};
  app.commit(() => {
    app.fs.answers = { branch: null, values: {}, files: {} };
    app.fs.ui.step = app.form.hasBranches ? 'yon' : 't1';
  });
}

// --- Form üst bilgisi ---------------------------------------------------------

function noteBox(app, req, text, tone = 'amber') {
  return h(
    'div',
    { class: `note note-${tone}` },
    h('button', { type: 'button', class: 'req-link', onclick: () => app.goToRequirement(req) }, req),
    ' ',
    text,
  );
}

function formHeader(app, full) {
  const { form, fs } = app;
  const hd = form.header;
  const showNotes = fs.ui.showNotes !== false;
  const statusOf = statusLookup(app.state, app.formId);
  const el = h('div', { class: 'form-header' }, h('h2', { class: 'form-title' }, hd.title));
  if (!full) return el;
  if (hd.intro) el.append(h('p', {}, hd.intro));
  if (hd.notices && hd.notices.length) {
    el.append(h('p', { class: 'strong' }, hd.noticeTitle));
    el.append(
      h(
        'ul',
        { class: 'notice-list' },
        hd.notices.map((n) =>
          h('li', {}, h('strong', {}, n.title), ' ', n.text, n.email ? h('ul', {}, h('li', {}, h('a', { href: `mailto:${n.email}` }, n.email))) : null),
        ),
      ),
    );
    if (showNotes && hd.noticeFlag && !isMandatoryStatus(statusOf(hd.noticeFlag.req))) {
      el.append(noteBox(app, hd.noticeFlag.req, hd.noticeFlag.text));
    }
  }
  if (hd.privacy) {
    el.append(
      h(
        'p',
        {},
        hd.privacy.before,
        h('a', { href: hd.privacy.url, target: '_blank', rel: 'noopener noreferrer', id: 'privacy-link' }, hd.privacy.link),
      ),
    );
    if (showNotes) el.append(noteBox(app, hd.privacy.flag.req, hd.privacy.flag.text));
  }
  el.append(h('p', { class: 'req-legend' }, hd.requiredLegend));
  return el;
}

// --- Adım göstergesi ----------------------------------------------------------

function stepper(app, steps, idx) {
  const fs = app.fs;
  const visited = fs.ui.visited || {};
  const locked = app.form.hasBranches && !fs.answers.branch;
  const route = routedSectionIds(app.form, fs.answers.values);
  const firstSection = steps.findIndex((s) => s.kind === 'section');
  const list = h('ol', { class: 'stepper', 'aria-label': `Adım ${idx + 1} / ${steps.length}` });
  steps.forEach((s, i) => {
    const reachable = i === 0 || (!locked && (visited[s.id] || i <= idx));
    const state = i === idx ? 'current' : visited[s.id] || i < idx ? 'done' : '';
    list.append(
      h(
        'li',
        { class: `step ${state}` },
        h(
          'button',
          {
            type: 'button',
            class: 'step-btn',
            disabled: !reachable,
            'aria-current': i === idx ? 'step' : null,
            onclick: () => goToStep(app, s.id),
          },
          h('span', { class: 'step-num' }, String(i + 1)),
          h('span', { class: 'step-label' }, s.kind === 'section' ? `${s.short} · ${s.label}` : s.label),
        ),
      ),
    );
    // Yönlendirme sorusu yanıtlanmadan ilk sayfadan sonraki sayfalar bilinmez.
    if (i === firstSection && (route.pending || route.unmapped)) {
      const routeField = effectiveForm(app.formId, app.state, fs.answers.branch).fieldsById.get(app.form.routing.fieldId);
      const text = route.pending ? `Sonraki sayfalar "${routeField.label}" yanıtına göre belirlenir` : `Bu "${routeField.label}" yanıtı için yönlendirme tanımlı değil`;
      list.append(h('li', { class: 'step pending', title: text }, h('span', { class: 'step-num' }, '…'), h('span', { class: 'step-label' }, text)));
    }
  });
  return h('div', { class: 'stepper-wrap' }, h('p', { class: 'step-count' }, `Adım ${idx + 1} / ${steps.length}`), list);
}

function goToStep(app, stepId) {
  app.commit(() => {
    app.fs.ui.step = stepId;
    app.fs.ui.visited = { ...(app.fs.ui.visited || {}), [stepId]: true };
  });
  window.scrollTo(0, 0);
}

function branchChip(app) {
  const branch = app.fs.answers.branch;
  return h(
    'div',
    { class: 'branch-chip' },
    h('span', {}, 'Fatura yönü: '),
    h('strong', {}, BRANCHES[branch]),
    button('Değiştir', () => goToStep(app, 'yon'), { small: true, variant: 'ghost', id: 'btn-change-branch' }),
  );
}

function errorSummary(errors) {
  return h(
    'div',
    { class: 'error-summary', role: 'alert', id: 'error-summary', tabindex: '-1' },
    h('h3', {}, `Lütfen ${errors.length} hatayı düzeltin`),
    h(
      'ul',
      {},
      errors.map((e) =>
        h('li', {}, h('a', { href: `#in-${e.fieldId}`, onclick: (ev) => {
          ev.preventDefault();
          const el = document.getElementById(`in-${e.fieldId}`) || document.querySelector(`[name="in-${e.fieldId}"]`);
          if (el) el.focus();
        } }, `${e.label}: ${e.message}`)),
      ),
    ),
  );
}

// --- Adım 0: fatura yönü ------------------------------------------------------

function branchStep(app, attempted) {
  const { form, fs } = app;
  const bq = form.branchQuestion;
  const showNotes = fs.ui.showNotes !== false;
  const invalid = attempted && !fs.answers.branch;
  const fieldset = h(
    'fieldset',
    { class: `question branch-question ${invalid ? 'invalid' : ''}`, id: 'fld-faturaYonu', 'aria-describedby': invalid ? 'err-faturaYonu' : null },
    h('legend', {}, bq.label, h('span', { class: 'req', 'aria-hidden': 'true' }, ' *')),
  );
  if (showNotes) {
    fieldset.append(h('div', { class: 'field-meta' }, chipSource('BRIEF', 'Cari Form, Bölüm A'), ...bq.reqs.map((r) => reqChip(app, r))));
  }
  const cards = h('div', { class: 'branch-cards' });
  bq.options.forEach((opt, i) => {
    const id = i === 0 ? 'in-faturaYonu' : `in-faturaYonu-${i}`;
    const checked = fs.answers.branch === opt.value;
    cards.append(
      h(
        'label',
        { class: `branch-card ${checked ? 'selected' : ''}`, for: id },
        h('input', { type: 'radio', name: 'in-faturaYonu', id, value: opt.value, checked, 'aria-invalid': invalid ? 'true' : null, onchange: () => setBranch(app, opt.value) }),
        h('span', { class: 'branch-card-title' }, opt.label),
        showNotes ? h('span', { class: 'branch-card-hint' }, opt.hint) : null,
      ),
    );
  });
  fieldset.append(cards);
  if (invalid) fieldset.append(h('p', { class: 'field-error', id: 'err-faturaYonu' }, REQUIRED_MESSAGE));
  fieldset.append(fieldNoteButton(app, 'faturaYonu', bq.label));
  return fieldset;
}

function setBranch(app, value) {
  const formId = app.formId;
  const fs = app.fs;
  const prev = fs.answers.branch;
  if (prev === value) return;
  let cleared = [];
  if (prev && behaviorOn(formId, app.state, 'clearOnBranch')) {
    const probe = { ...app.state, forms: { ...app.state.forms, [formId]: fs } };
    cleared = invalidChoicesAfterBranchChange(formId, probe, value);
  }
  app.transient.submitted[formId] = null;
  app.commit(() => {
    fs.answers.branch = value;
    for (const f of cleared) delete fs.answers.values[f.id];
    app.transient.attempted[formId].yon = false;
  });
  if (cleared.length) toast(`${cleared.map((f) => `"${f.label}"`).join(', ')} seçimi yeni fatura yönünde geçerli olmadığı için temizlendi (C-P06).`, 'warn');
}

// --- Bölüm adımı --------------------------------------------------------------

function sectionStep(app, sectionId, validation) {
  const { formId, fs } = app;
  const eff = effectiveForm(formId, app.state, fs.answers.branch);
  const section = eff.sections.find((s) => s.id === sectionId);
  const showNotes = fs.ui.showNotes !== false;
  const wrap = h('section', { class: 'form-section', 'aria-labelledby': `sec-${sectionId}` });
  wrap.append(h('div', { class: 'section-head' }, h('p', { class: 'page-label' }, section.pageLabel), h('h3', { id: `sec-${sectionId}`, class: 'section-title' }, section.title)));
  if (showNotes && section.titleNote) wrap.append(h('p', { class: 'meta-note' }, section.titleNote));
  const groupingOn = behaviorOn(formId, app.state, 'presentation');
  for (const group of section.groups) {
    const fields = group.fields.filter((f) => !f.removed);
    if (!fields.length) continue;
    const g = h('div', { class: 'field-group' });
    if (group.title && groupingOn) g.append(h('h4', { class: 'group-title' }, group.title));
    for (const field of fields) g.append(renderField(app, field, validation ? validation.results[field.id] : null));
    wrap.append(g);
  }
  return wrap;
}

function chipSource(sourceId, ref) {
  return h('span', { class: 'chip chip-source', title: SOURCES[sourceId] ? SOURCES[sourceId].title : sourceId }, `${sourceId}${ref ? ` · ${ref}` : ''}`);
}

function reqChip(app, reqId) {
  return h('button', { type: 'button', class: 'chip chip-req', onclick: () => app.goToRequirement(reqId), title: 'Gereksinimi göster' }, reqId);
}

function fieldNoteButton(app, fieldId, label) {
  return h(
    'button',
    {
      type: 'button',
      class: 'note-btn',
      'aria-label': `"${label}" için geri bildirim ekle`,
      title: 'Bu alan için geri bildirim ekle',
      onclick: () => openFeedbackDialog(app, { form: app.formId, branch: app.fs.answers.branch || 'all', target: `field:${fieldId}` }),
    },
    'Not',
  );
}

function fileSize(bytes) {
  if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  return `${Math.max(1, Math.round(bytes / 1024))} KB`;
}

function liveResult(app, field) {
  const fs = app.fs;
  return validateField(field, fs.answers.values[field.id], fs.answers.files[field.id], statusLookup(app.state, app.formId), validationOpts(app.formId, app.state));
}

function feedbackBlock(field, result, showNotes) {
  const block = h('div', { class: 'field-feedback', id: `fb-${field.id}`, 'aria-live': 'polite' });
  if (!result) return block;
  result.errors.forEach((m, i) => block.append(h('p', { class: 'field-error', id: i === 0 ? `err-${field.id}` : null }, m)));
  if (showNotes) {
    for (const w of result.warnings) block.append(h('p', { class: 'field-warning' }, h('strong', {}, `Öneri (${w.req}, engellemez): `), w.message));
  }
  return block;
}

function renderField(app, field, result) {
  const { formId, fs } = app;
  const showNotes = fs.ui.showNotes !== false;
  const value = fs.answers.values[field.id] ?? '';
  const statusOf = statusLookup(app.state, formId);
  // Uyarılar her zaman canlı gösterilir; hatalar yalnızca adım denendikten sonra.
  const live = liveResult(app, field);
  const shown = result || (live.warnings.length ? { errors: [], warnings: live.warnings } : null);
  const invalid = Boolean(result && result.errors.length);
  const inputId = `in-${field.id}`;
  const describedBy = [field.help ? `help-${field.id}` : null, invalid ? `err-${field.id}` : null].filter(Boolean).join(' ') || null;

  const wrapper = h(field.type === 'radio' ? 'fieldset' : 'div', {
    class: `question ${invalid ? 'invalid' : ''} ${field.proposalReq ? 'proposed' : ''} ${field.addedBy ? 'added' : ''}`,
    id: `fld-${field.id}`,
  });
  const labelText = [field.label, field.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, ' *') : null];
  const head = h('div', { class: `question-head ${field.type === 'radio' ? 'floating' : ''}` });
  if (field.type === 'radio') wrapper.append(h('legend', { class: 'question-label' }, ...labelText));
  else head.append(h('label', { class: 'question-label', for: inputId }, ...labelText));
  head.append(fieldNoteButton(app, field.id, field.label));
  wrapper.append(head);
  if (field.help) wrapper.append(h('p', { class: 'question-help', id: `help-${field.id}` }, field.help));

  if (showNotes) {
    const meta = h('div', { class: 'field-meta' });
    if (field.addedBy) meta.append(badge(`Kararla eklendi: ${field.addedBy}`, 'blue'));
    else meta.append(chipSource(field.source, field.ref));
    for (const r of field.reqs || []) meta.append(reqChip(app, r));
    if (field.changedBy && field.changedBy.length && !field.addedBy) meta.append(badge(`Kararla değişti: ${field.changedBy.join(', ')}`, 'blue'));
    if (field.proposalReq && !isMandatoryStatus(statusOf(field.proposalReq))) meta.append(badge('Önerilen alan — onay bekliyor', 'purple'));
    if (field.labelNote) meta.append(h('span', { class: 'meta-note inline' }, field.labelNote));
    if (field.optionsByBranch) meta.append(badge('Seçenekler fatura yönüne göre değişir', 'teal'));
    if (app.form.routing && field.id === app.form.routing.fieldId) meta.append(badge('Seçim sonraki sayfaları belirler', 'teal'));
    if (field.maxLength) meta.append(badge(`En fazla ${field.maxLength} karakter`, 'gray', 'Canlı formdaki yanıt doğrulaması (DOC-D)'));
    wrapper.append(meta);
    for (const flag of field.flags || []) {
      const st = statusOf(flag.req);
      if (isMandatoryStatus(st) || st === 'reddedildi' || st === 'ertelendi') continue;
      if (!flagActive(flag, fs.answers.values, fs.answers.branch)) continue;
      if (flag.req === field.proposalReq) continue;
      wrapper.append(noteBox(app, flag.req, flag.text));
    }
  }

  const refreshFeedback = () => {
    const old = document.getElementById(`fb-${field.id}`);
    if (!old) return;
    const attempted = app.transient.attempted[formId][field.sectionId];
    const res = liveResult(app, field);
    const next = feedbackBlock(field, attempted ? res : { errors: [], warnings: res.warnings }, showNotes);
    old.replaceWith(next);
    const input = document.getElementById(inputId);
    const bad = attempted && res.errors.length > 0;
    if (input) input.setAttribute('aria-invalid', bad ? 'true' : 'false');
    wrapper.classList.toggle('invalid', bad);
  };

  if (field.type === 'text' || field.type === 'textarea') {
    const input = h(field.type === 'textarea' ? 'textarea' : 'input', {
      type: field.type === 'text' ? 'text' : null,
      rows: field.type === 'textarea' ? 3 : null,
      id: inputId,
      class: 'input',
      value,
      placeholder: field.placeholder || null,
      inputmode: field.inputMode || null,
      autocomplete: 'off',
      'aria-invalid': invalid ? 'true' : 'false',
      'aria-describedby': describedBy,
      'aria-required': field.required ? 'true' : null,
    });
    input.addEventListener('input', () => {
      fs.answers.values[field.id] = input.value;
      app.transient.submitted[formId] = null;
      app.save();
      refreshFeedback();
    });
    wrapper.append(input);
  } else if (field.type === 'radio') {
    const group = h('div', { class: 'radio-group', role: 'radiogroup', 'aria-describedby': describedBy });
    field.options.forEach((opt, i) => {
      const id = i === 0 ? inputId : `${inputId}-${i}`;
      group.append(
        h(
          'label',
          { class: 'radio', for: id },
          h('input', { type: 'radio', name: inputId, id, value: opt, checked: value === opt, 'aria-invalid': invalid ? 'true' : 'false', onchange: () => setValue(app, field.id, opt) }),
          h('span', {}, opt),
        ),
      );
    });
    wrapper.append(group);
    if (field.clearable && value) wrapper.append(button('Seçimi temizle', () => setValue(app, field.id, ''), { small: true, variant: 'ghost', id: `clear-${field.id}` }));
  } else if (field.type === 'select') {
    const sel = h('select', { id: inputId, class: 'input select', 'aria-invalid': invalid ? 'true' : 'false', 'aria-describedby': describedBy, 'aria-required': field.required ? 'true' : null, onchange: (e) => setValue(app, field.id, e.target.value) });
    sel.append(h('option', { value: '' }, field.placeholder || 'Seçin'));
    for (const opt of field.options || []) sel.append(h('option', { value: opt }, opt));
    for (const opt of field.prototypeOptions || []) sel.append(h('option', { value: opt.value }, opt.label));
    sel.value = value;
    wrapper.append(sel);
  } else if (field.type === 'file') {
    const meta = fs.answers.files[field.id];
    const input = h('input', { type: 'file', id: inputId, class: 'file-input', accept: field.file && field.file.accept ? field.file.accept : null, 'aria-invalid': invalid ? 'true' : 'false', 'aria-describedby': describedBy });
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const next = { name: file.name, size: file.size, type: file.type };
      const problems = fileErrors(field, next);
      app.transient.submitted[formId] = null;
      app.commit(() => {
        fs.answers.files[field.id] = next;
      });
      if (problems.length) toast(problems.join(' '), 'error');
    });
    wrapper.append(
      h(
        'div',
        { class: 'file-row' },
        h('label', { class: 'btn btn-sm file-btn', for: inputId }, meta ? 'Dosyayı değiştir' : 'Dosya ekle'),
        input,
        meta
          ? h(
            'span',
            { class: 'file-name' },
            `${meta.name} (${fileSize(meta.size)})${meta.sample ? ' — ÖRNEK, simülasyon' : ''}`,
            button('Kaldır', () => app.commit(() => {
              delete fs.answers.files[field.id];
            }), { small: true, variant: 'ghost', id: `remove-${field.id}` }),
          )
          : h('span', { class: 'file-name muted' }, 'Dosya seçilmedi'),
      ),
    );
    if (showNotes) wrapper.append(h('p', { class: 'meta-note' }, 'Prototip: dosya hiçbir yere yüklenmez ve saklanmaz; yalnızca ad, boyut ve tür kontrol edilir.'));
  }
  wrapper.append(feedbackBlock(field, shown, showNotes));
  return wrapper;
}

function setValue(app, fieldId, value) {
  app.transient.submitted[app.formId] = null;
  app.commit(() => {
    if (value === '') delete app.fs.answers.values[fieldId];
    else app.fs.answers.values[fieldId] = value;
  });
}

// --- Gözden geçir -------------------------------------------------------------

function answerText(field, fs) {
  if (field.type === 'file') {
    const meta = fs.answers.files[field.id];
    return meta ? `${meta.name} (${fileSize(meta.size)})` : '—';
  }
  const v = fs.answers.values[field.id];
  if (v === undefined || v === null || String(v).trim() === '') return '—';
  return displayValue(field, v);
}

function reviewStep(app) {
  const { formId, form, fs } = app;
  const steps = stepsFor(formId, app.state);
  const eff = effectiveForm(formId, app.state, fs.answers.branch);
  const showNotes = fs.ui.showNotes !== false;
  const wrap = h('section', { class: 'form-section review', 'aria-labelledby': 'sec-review' });
  wrap.append(h('div', { class: 'section-head' }, h('p', { class: 'page-label' }, 'Son adım'), h('h3', { id: 'sec-review', class: 'section-title' }, 'Gözden geçir ve gönder')));
  wrap.append(h('p', { class: 'muted' }, 'Yanıtlarınızı kontrol edin. Değiştirmek için ilgili bölümde "Düzenle"yi kullanın.'));
  if (form.hasBranches) {
    wrap.append(
      h('div', { class: 'review-block' },
        h('div', { class: 'review-head' }, h('h4', {}, 'Adım 0 — Fatura yönü'), button('Düzenle', () => goToStep(app, 'yon'), { small: true, variant: 'ghost', id: 'edit-yon' })),
        h('dl', { class: 'review-list' }, h('dt', {}, form.branchQuestion.label), h('dd', {}, fs.answers.branch ? BRANCHES[fs.answers.branch] : '—')),
      ),
    );
  }
  // Yol sırasıyla (ör. İstisna yolunda 5/6 → 3/6).
  for (const step of steps.filter((s) => s.kind === 'section')) {
    const section = eff.sections.find((s) => s.id === step.id);
    const dl = h('dl', { class: 'review-list' });
    for (const f of sectionFields(section)) dl.append(h('dt', {}, f.label, f.required ? ' *' : ''), h('dd', {}, answerText(f, fs)));
    wrap.append(
      h('div', { class: 'review-block' },

// --- Yardımcılar -------------------------------------------------------------

function stableStringify(value) {
  if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
  if (value && typeof value === 'object') {
    return `{${Object.keys(value).sort().map((k) => `${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
  }
  return JSON.stringify(value === undefined ? null : value);
}

function fnv1a(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i += 1) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

const withoutTimes = ({ createdAt, updatedAt, ...rest }) => rest;

function reviewHash(formId, state) {
  const fs = state.forms[formId];
  const statusOf = statusLookup(state, formId);
  const noteOf = noteLookup(state, formId);
  const statuses = requirementsFor(formId).map((r) => [r.id, statusOf(r.id), noteOf(r.id)]);
  return fnv1a(
    stableStringify({
      formId,
      statuses,
      decisions: fs.decisions.map(withoutTimes),
      feedback: fs.feedback.map(withoutTimes),
      experienceConfirmed: Boolean(fs.experienceConfirmed),
      reviewed: fs.sectionReviewed,
    }),
  );
}

const q = (s) => `"${s}"`;
const byId = (a, b) => a.id.localeCompare(b.id, 'tr', { numeric: true });

function sourceText(ids) {
  return ids.map((id) => (SOURCES[id] ? id : id)).join(', ');
}

function fieldTypeText(field) {
  return FIELD_TYPES[field.type] || field.type;
}

function fileText(file) {
  const parts = [`en fazla ${file.maxFiles || 1} dosya`];
  parts.push(file.maxSizeMB ? `en fazla ${file.maxSizeMB} MB` : 'boyut sınırı belgede yok');
  parts.push(file.acceptLabel ? `yalnızca ${file.acceptLabel}` : 'dosya türü kısıtı belgede yok');
  return parts.join(', ');
}

function decisionChangeText(decision, formId, state) {
  const change = decision.change || { kind: 'none' };
  if (change.kind === 'modify') {
    const p = change.patch || {};
    const parts = [];
    if (p.label) parts.push(`etiket → ${q(p.label)}`);
    if (p.help) parts.push(`açıklama metni → ${q(p.help)}`);
    if (p.placeholder) parts.push(`yer tutucu → ${q(p.placeholder)}`);
    if (p.required === 'required') parts.push('zorunlu yapılır');
    if (p.required === 'optional') parts.push('isteğe bağlı yapılır');
    if (p.options && p.options.length) parts.push(`seçenekler → ${p.options.map(q).join(', ')}`);
    if (p.removed) parts.push('alan kaldırılır');
    if (p.restore) parts.push('alan geri eklenir');
    return `${targetLabel(formId, state, `field:${change.fieldId}`)}: ${parts.join('; ') || 'yapısal değişiklik yok'}`;
  }
  if (change.kind === 'add' && change.add) {
    const a = change.add;
    const section = getForm(formId).sections.find((s) => s.id === a.sectionId);
    const opts = a.options && a.options.length ? `; seçenekler: ${a.options.map(q).join(', ')}` : '';
    const help = a.help ? `; açıklama: ${q(a.help)}` : '';
    return `Yeni alan ${q(a.label)} (${FIELD_TYPES[a.type] || a.type}, ${a.required ? 'zorunlu' : 'isteğe bağlı'}${opts}${help}) → ${section ? sectionTitle(section) : a.sectionId} bölümünün sonuna eklenir`;
  }
  return '';
}

// Bir alanın prompt için öznitelik satırları (sıralı [anahtar, değer]).
function fieldAttrs(field, ctx) {
  const a = [];
  a.push(['Tür', fieldTypeText(field)]);
  a.push(['Zorunlu', field.required ? 'Evet' : 'Hayır (isteğe bağlı)']);
  if (field.help) a.push(['Açıklama metni (alan altında)', q(field.help)]);
  if (field.placeholder) a.push(['Yer tutucu', q(field.placeholder)]);
  if (field.options && field.options.length) a.push(['Seçenekler (bu sırayla)', field.options.map(q).join(', ')]);
  if (field.clearable) a.push(['Seçimi temizle', 'Var (yanıt seçildikten sonra "Seçimi temizle" eylemi)']);
  if (field.file) a.push(['Dosya kısıtları', fileText(field.file)]);
  if (field.maxLength) {
    a.push(['Uzunluk doğrulaması (canlı form, DOC-D)', `en fazla ${field.maxLength} karakter. Hata metni belgede yok (Google varsayılanıydı); prototipteki metin: ${q(maxLengthMessage(field.maxLength))}`]);
  }
  for (const check of field.checks || []) {
    const status = ctx.statusOf(check.req);
    if (isMandatoryStatus(status)) a.push([`Format doğrulaması (${check.req}, onaylı)`, `${CHECKS[check.kind].label} — hata metni: ${q(CHECKS[check.kind].message)}`]);
    else if (status === 'oneri' || status === 'acik-soru') a.push([`Önerilen format doğrulaması (${check.req})`, `${CHECKS[check.kind].label} — OPSİYONEL, onaylanmadı; onay almadan uygulama`]);
  }
  if (field.proposalReq && !isMandatoryStatus(ctx.statusOf(field.proposalReq))) {
    a.push(['Durum', `ÖNERİLEN ALAN (${field.proposalReq}, ${STATUS[ctx.statusOf(field.proposalReq)].label}) — onaylanmadan uygulama`]);
  }
  if (field.originalOptions) a.push(['Belgedeki eski seçenekler', `${field.originalOptions.map(q).join(', ')} — C-002 ile değiştirildi; kullanma`]);
  if (field.prototypeOptions && field.prototypeOptions.length) {
    a.push(['Prototip yer tutucu seçeneği', `${field.prototypeOptions.map((o) => q(o.label)).join(', ')} yalnızca prototipte test içindir; belgede yok, UYGULAMA`]);
  }
  if (field.labelNote) a.push(['Not', field.labelNote]);
  a.push(['Kaynak', `${field.source}${field.ref ? ` — ${field.ref}` : ''}${field.reqs && field.reqs.length ? ` (${field.reqs.join(', ')})` : ''}`]);
  if (field.changedBy && field.changedBy.length) a.push(['Onaylı değişiklik uygulandı', `${field.changedBy.join(', ')} (Bölüm 11)`]);
  for (const flag of field.flags || []) {
    const status = ctx.statusOf(flag.req);
    if (isDroppedStatus(status)) continue;
    const cond = describeFlagCondition(flag, ctx.fieldsById, BRANCHES);
    if (isMandatoryStatus(status)) {
      const note = ctx.noteOf(flag.req);
      if (note) a.push([`Karar (${flag.req})`, `${cond}: ${note}`]);
    } else {
      a.push([`Belirsizlik (${flag.req})`, `${cond}: ${flag.text} Davranış uydurma; Bölüm 12'ye bak.`]);
    }
  }
  return a;
}

function buildContext(formId, state) {
  const form = getForm(formId);
  const fs = state.forms[formId];
  const statusOf = statusLookup(state, formId);
  const noteOf = noteLookup(state, formId);
  const reqs = requirementsFor(formId).map((r) => ({ ...r, status: statusOf(r.id), note: noteOf(r.id) })).sort(byId);
  const branches = form.hasBranches ? ['issue', 'receive'] : [null];
  const eff = {};
  for (const b of branches) eff[b] = effectiveForm(formId, state, b);
  const fieldsById = new Map();
  for (const b of branches) for (const [id, f] of eff[b].fieldsById) if (!fieldsById.has(id)) fieldsById.set(id, f);
  return { formId, form, fs, state, statusOf, noteOf, reqs, branches, eff, fieldsById, ready: readiness(formId, state), hash: reviewHash(formId, state) };
}

const behaviorStatus = (ctx, key) => {
  const id = BEHAVIOR_REQS[ctx.formId][key];
  return id ? { id, status: ctx.statusOf(id) } : null;
};

// Prototip davranışının prompttaki durumu: 'on' (onaylı), 'off' (reddedildi/ertelendi), 'pending' (öneri/açık).
function behaviorMode(ctx, key) {
  const b = behaviorStatus(ctx, key);
  if (!b) return 'off';
  if (isMandatoryStatus(b.status)) return 'on';
  if (isDroppedStatus(b.status)) return 'off';
  return 'pending';
}

// Yönlendirmeye bağlı sayfadaki alanlar için kısa not; ilk sayfa ve yönlendirmesiz formlarda boş.
function conditionNote(ctx, field) {
  const answers = routeAnswersFor(ctx.form, field.sectionId);
  if (!answers) return '';
  return ` (yalnızca ${q(routingLabel(ctx))} = ${answers.map(q).join(' / ')} iken)`;
}

// Bir sayfadan sonra yönlendirmeye göre ne geldiği.
function nextPageText(ctx, sectionId) {
  for (const g of routeGroups(ctx.form)) {
    const i = g.path.indexOf(sectionId);
    if (i >= 0) return g.path[i + 1] ? pageTitle(ctx, g.path[i + 1]) : 'form gönderilir';
  }
  return 'form gönderilir';
}

// "Sayfa 1/6 → Sayfa 2/6 — … → Gönder" biçiminde yol metni.
function pathText(ctx, path) {
  const first = ctx.form.sections.find((s) => s.kind === 'fields');
  return [first.pageLabel, ...path.map((id) => pageTitle(ctx, id)), 'Gönder'].join(' → ');
}

const proposalPending = (ctx, f) => Boolean(f.proposalReq && !isMandatoryStatus(ctx.statusOf(f.proposalReq)));

function behaviorLine(ctx, key, onText) {
  const b = behaviorStatus(ctx, key);
  if (!b) return null;
  if (isMandatoryStatus(b.status)) return `${onText} (${b.id} — onaylı, ZORUNLU).`;
  if (isDroppedStatus(b.status)) return `${onText} — UYGULANMAYACAK (${b.id}: ${STATUS[b.status].label}).`;
  return `${onText} — OPSİYONEL ÖNERİ (${b.id}, onaylanmadı; uygulamadan önce onay iste).`;
}

function orderedFieldIds(ctx, section) {
  const ids = [];
  for (const b of ctx.branches) {
    const s = ctx.eff[b].sections.find((x) => x.id === section.id);
    for (const f of sectionFields(s, { includeRemoved: true })) if (!ids.includes(f.id)) ids.push(f.id);
  }
  return ids;
}

function fieldInBranch(ctx, sectionId, fieldId, branch) {
  const s = ctx.eff[branch].sections.find((x) => x.id === sectionId);
  return sectionFields(s, { includeRemoved: true }).find((f) => f.id === fieldId) || null;
}

function fieldBlock(ctx, section, fieldId, n, L) {
  const per = ctx.branches.map((b) => [b, fieldInBranch(ctx, section.id, fieldId, b)]);
  const present = per.filter(([, f]) => f && !f.removed);
  const any = per.find(([, f]) => f)[1];
  if (!present.length) {
    if (any.proposalReq && !any.changedBy.length) return n; // reddedilen/ertelenen öneri alanı: Bölüm 3.4/3.3'te
    L.push(`${n}. \`${fieldId}\` — ${q(any.label)} — KALDIRILDI (${any.changedBy.join(', ')})`);
    return n + 1;
  }
  const first = present[0][1];
  L.push(`${n}. \`${fieldId}\` — ${q(first.label)}`);
  if (ctx.branches.length > 1) {
    const missing = per.filter(([, f]) => !f || f.removed).map(([b]) => BRANCHES[b]);
    if (missing.length) L.push(`   - Branş: yalnızca ${present.map(([b]) => BRANCHES[b]).join(', ')} (${missing.join(', ')} branşında yok)`);
  }
  const attrs = present.map(([b, f]) => [b, fieldAttrs(f, ctx)]);
  const keys = [];
  for (const [, list] of attrs) for (const [k] of list) if (!keys.includes(k)) keys.push(k);
  for (const key of keys) {
    const vals = attrs.map(([b, list]) => [b, (list.find(([k]) => k === key) || [])[1]]);
    const distinct = new Set(vals.map(([, v]) => v || ''));
    if (distinct.size === 1) {
      if (vals[0][1]) L.push(`   - ${key}: ${vals[0][1]}`);
    } else {
      for (const [b, v] of vals) L.push(`   - ${key} [${BRANCHES[b]}]: ${v || '—'}`);
    }
  }
  return n + 1;
}

    L.push(`### ${sectionTitle(section)}`, '');
    if (section.kind === 'technical') {
      L.push(`- TEKNİK BÖLÜM (${section.reqs.join(', ')}; kaynak: ${section.source} — ${section.ref}). ${section.note}`);
      L.push('- Yeni uygulamada bu bölümün karşılığını kullanıcıya gösterme; yalnızca yönlendirmeyi (Bölüm 7) koru.', '');
      continue;
    }
    if (section.titleNote) L.push(`Not: ${section.titleNote}`, '');
    const answers = routeAnswersFor(ctx.form, section.id);
    if (answers) {
      L.push(`Gösterim koşulu: yalnızca ${q(routingLabel(ctx))} = ${answers.map(q).join(' / ')} iken (C-041, C-042). Bu sayfadan sonra: ${nextPageText(ctx, section.id)}.`, '');
    }
    let n = 1;
    const baseGroups = ctx.eff[ctx.branches[0]].sections.find((s) => s.id === section.id).groups;
    const ids = orderedFieldIds(ctx, section);
    for (const group of baseGroups) {
      const groupIds = ids.filter((id) => group.fields.some((f) => f.id === id));
      if (group.title) L.push(`#### ${group.title}`, '');
      for (const id of groupIds) n = fieldBlock(ctx, section, id, n, L);
      if (group.title) L.push('');
    }
    // Yalnızca diğer branşta eklenmiş alanlar
    const leftovers = ids.filter((id) => !baseGroups.some((g) => g.fields.some((f) => f.id === id)));
    for (const id of leftovers) n = fieldBlock(ctx, section, id, n, L);
    L.push('');
  }
}

function texts(ctx, L) {
  const { form } = ctx;
  const h = form.header;
  L.push('## 5. Metin içerikleri (birebir kullanılacak)', '');
  L.push(`- Form başlığı: ${q(h.title)}`);
  if (h.intro) L.push(`- Giriş metni: ${q(h.intro)}`);
  if (h.notices && h.notices.length) {
    L.push(`- Bilgilendirme başlığı (kalın): ${q(h.noticeTitle)}`);
    for (const n of h.notices) L.push(`  - Madde (${n.req}): kalın ${q(n.title)} + ${q(n.text)}${n.email ? ` + e-posta bağlantısı ${n.email} (mailto)` : ''}`);
    if (h.noticeFlag) {
      const st = ctx.statusOf(h.noticeFlag.req);
      if (!isMandatoryStatus(st)) L.push(`  - Belirsizlik (${h.noticeFlag.req}): ${h.noticeFlag.text} Karar verilene kadar bilgilendirme her iki branşta gösterilir; branşa göre gizleme uydurma.`);
      else if (ctx.noteOf(h.noticeFlag.req)) L.push(`  - Karar (${h.noticeFlag.req}): ${ctx.noteOf(h.noticeFlag.req)}`);
    }
  }
  if (h.privacy) {
    const flagReq = h.privacy.flag.req;
    const decided = isMandatoryStatus(ctx.statusOf(flagReq)) && ctx.noteOf(flagReq);
    const address = decided
      ? `karar (${flagReq}): ${ctx.noteOf(flagReq)}`
      : `canlı formda ${h.privacy.url}; bu adresin boş sayfa açtığı bildirildi (C-009) ve düzeltme yolu açık soru (${flagReq}). Adresi yapılandırılabilir tut; doğrulanmış sayma`;
    L.push(`- Gizlilik metni (${h.privacy.req}): ${q(h.privacy.before.trim())} + bağlantı metni ${q(h.privacy.link)}. Bağlantı adresi: ${address}.`);
  }
  if (form.confirmation) L.push(`- Gönderim sonrası onay mesajı (${form.confirmation.req}, ${form.confirmation.source}): ${q(form.confirmation.text)}`);
  L.push(`- Zorunluluk açıklaması: ${q(h.requiredLegend)} (yıldız kırmızı)`);
  L.push(`- Zorunlu alan hata mesajı: ${q(REQUIRED_MESSAGE)}`);
  if (form.hasBranches) {
    L.push(`- İlk soru: ${q(form.branchQuestion.label)}; seçenekler ${form.branchQuestion.options.map((o) => q(o.label)).join(' / ')}`);
    const cat = ctx.fieldsById.get('cariTuru');
    if (cat && cat.helpByBranch) {
      L.push(`- Kategori sorusu açıklaması [Fatura keseceğim]: ${q(cat.helpByBranch.issue)}`);
      L.push(`- Kategori sorusu açıklaması [Bana fatura kesilecek]: ${q(cat.helpByBranch.receive)}`);
    }
  }
  const nav = form.navigation;
  L.push(`- Düğmeler: ${Object.values(nav).filter((v) => !v.includes('X /')).map(q).join(', ')}${nav.progress ? `; ilerleme göstergesi biçimi ${q(nav.progress)} (sayfa sayısı yeni yapıya göre güncellenir)` : ''}`);
  L.push('');
}

function requiredMatrix(ctx, L) {
  L.push('## 6. Zorunlu ve isteğe bağlı alanlar', '');
  if (ctx.form.hasBranches) L.push(`- ${q(ctx.form.branchQuestion.label)}: Zorunlu (her iki branş için ilk adım)`);
  for (const section of ctx.form.sections) {
    if (section.kind !== 'fields') continue;
    for (const id of orderedFieldIds(ctx, section)) {
      const per = ctx.branches.map((b) => [b, fieldInBranch(ctx, section.id, id, b)]);
      const any = per.find(([, f]) => f)[1];
      if (per.every(([, f]) => !f || f.removed)) continue;
      const word = (f) => (!f || f.removed ? 'Yok' : f.required ? 'Zorunlu' : 'İsteğe bağlı');
      const proposal = any.proposalReq && !isMandatoryStatus(ctx.statusOf(any.proposalReq)) ? ` — önerilen alan (${any.proposalReq}), onaylanmadı` : '';
      const cond = conditionNote(ctx, any) ? ` —${conditionNote(ctx, any)}` : '';
      const words = per.map(([b, f]) => [b, word(f)]);
      const same = new Set(words.map(([, w]) => w)).size === 1;
      const value = same
        ? `${words[0][1]}${ctx.branches.length > 1 ? ' (her iki branş)' : ''}`
        : words.map(([b, w]) => `${BRANCHES[b]} → ${w}`).join(' · ');
      L.push(`- ${q(any.label)} (${sectionTitle(section)}): ${value}${proposal}${cond}`);
    }
  }
  L.push('');
}

function conditional(ctx, L) {
  L.push('## 7. Koşullu mantık ve dallanma', '');
  const decisionsBranch = ctx.fs.decisions.filter((d) => d.branch && d.branch !== 'all').sort(byId);
  if (ctx.form.hasBranches) {
    L.push('### 7.1 Fatura yönü (ana dallanma)', '');
    L.push('- Adım 0\'daki soru yanıtlanmadan form alanları gösterilmez ve sonraki adımlara geçilemez.');
    for (const b of ctx.branches) {
      const cat = ctx.eff[b].fieldsById.get('cariTuru');
      if (cat && !cat.removed) L.push(`- ${q(BRANCHES[b])} seçildiğinde ${q(cat.label)} seçenekleri tam olarak: ${cat.options.map(q).join(', ')}; açıklama: ${q(cat.help)}.`);
    }
    L.push('- Belgelerde iki branş arasında kategori listesi dışında başka bir fark tanımlanmamıştır. Aşağıda listelenen onaylı branş kararları dışında fark uydurma (açık soru: C-Q05).');
    const clear = behaviorLine(ctx, 'clearOnBranch', 'Yön değiştirildiğinde yeni branşta geçersiz kalan Cari Türü seçimi temizlenir, kullanıcı bilgilendirilir ve diğer yanıtlar korunur');
    if (clear) L.push(`- ${clear}`);
    if (decisionsBranch.length) {
      L.push('- Onaylı branşa özgü kararlar:');
      for (const d of decisionsBranch) L.push(`  - [${d.id}] Yalnızca ${q(BRANCH_SCOPES[d.branch])}: ${d.text}${decisionChangeText(d, ctx.formId, ctx.state) ? ` (${decisionChangeText(d, ctx.formId, ctx.state)})` : ''}`);
    }
    L.push('');
  } else if (!ctx.form.routing) {
    L.push('- Kaynak belgede koşullu alan, dallanma veya sayfa yönlendirmesi tanımlanmamıştır. Onaylı kararlar (Bölüm 11) dışında koşullu davranış ekleme.', '');
  }
  if (ctx.form.routing) {
    const label = routingLabel(ctx);
    L.push(`### ${ctx.form.hasBranches ? '7.2 ' : ''}Sayfa yönlendirmesi (${q(label)})`, '');
    const firstPage = ctx.form.sections.find((s) => s.kind === 'fields');
    L.push(`Canlı formdaki (${ctx.form.routing.source}) "yanıta göre bölüme git" ayarları ve bölüm sonu yönlendirmeleri. ${q(label)} sorusu ${firstPage.pageLabel} sayfasının son sorusudur ve sonraki sayfaları belirler:`, '');
    for (const g of routeGroups(ctx.form)) L.push(`- ${g.answers.map(q).join(', ')}: ${pathText(ctx, g.path)}`);
    L.push('');
    L.push('- Yolda olmayan sayfalar gösterilmez ve o sayfalardaki yanıtlar gönderilmez (kullanıcı geri dönüp seçimini değiştirirse yol yeniden hesaplanır).');
    L.push('- "İstisna Belgesi" yolunda sayfa sırası 5/6 → 3/6\'dır; sayfa numarası değil yol sırası esas alınır.');
    L.push('- Yönlendirme fatura yönünden bağımsızdır; iki branşta da aynıdır (fark olup olmayacağı açık soru: C-Q05).');
    L.push('- Bölüm sonu yönlendirmeleri, Google Forms\'un bu bilgiyi bir sonraki bölüm başlığında saklama kuralına göre okunmuştur (C-042, güven: güçlü çıkarım).');
    const technical = ctx.form.sections.filter((s) => s.kind === 'technical');
    for (const t of technical) L.push(`- ${sectionTitle(t)} (${t.reqs.join(', ')}): yalnızca yönlendirme için var; kullanıcıya gösterilmez ve yeni uygulamada gerekmez.`);
    L.push('');
  }
  const title = ctx.form.hasBranches ? `### 7.${ctx.form.routing ? 3 : 2} Davranışı belgelenmemiş durumlar` : '### Davranışı belgelenmemiş durumlar';
  L.push(title, '');
  let any = false;
  for (const [, f] of ctx.fieldsById) {
    for (const flag of f.flags || []) {
      if (!flag.when || flag.when.always) continue;
      const st = ctx.statusOf(flag.req);
      if (isMandatoryStatus(st) || isDroppedStatus(st)) continue;
      any = true;
      L.push(`- ${describeFlagCondition(flag, ctx.fieldsById, BRANCHES)}: ${flag.text} → Ek alan veya kural ekleme; ${flag.req} cevaplanana kadar belgedeki davranışı koru.`);
    }
  }
  if (!any) L.push('- Yok.');
  L.push('');
}

function validation(ctx, L) {
  L.push('## 8. Doğrulama ve hata yönetimi', '');
  L.push(`- Zorunlu alan boşsa ilerleme/gönderim engellenir; alan kırmızı çerçeveyle vurgulanır ve altında ${q(REQUIRED_MESSAGE)} gösterilir.`);
  const ws = behaviorLine(ctx, 'whitespace', 'Yalnızca boşluk karakterlerinden oluşan yanıt boş sayılır');
  if (ws) L.push(`- ${ws}`);
  L.push('- Tek seçimli/açılır liste alanlarında yalnızca tanımlı seçenekler kabul edilir.');
  for (const [, f] of ctx.fieldsById) {
    if (f.type !== 'file' || f.removed) continue;
    if (f.proposalReq && !isMandatoryStatus(ctx.statusOf(f.proposalReq))) continue;
    const rules = [];
    if (f.file.maxSizeMB) rules.push(`${f.file.maxSizeMB} MB üzeri dosya reddedilir: ${q(`Dosya en fazla ${f.file.maxSizeMB} MB olmalıdır.`)}`);
    if (f.file.accept === 'image/*') rules.push(`görsel olmayan dosya reddedilir: ${q('Yalnızca görsel (image) dosyası yükleyebilirsiniz.')}`);
    if (f.file.accept && f.file.accept.includes('pdf')) rules.push(`PDF olmayan dosya reddedilir: ${q('Yalnızca PDF dosyası yükleyebilirsiniz.')}`);
    rules.push(`en fazla ${f.file.maxFiles || 1} dosya`);
    L.push(`- ${q(f.label)}: ${rules.join('; ')}.`);
  }
  for (const [, f] of ctx.fieldsById) {
    if (!f.maxLength || f.removed) continue;
    L.push(`- ${q(f.label)}: en fazla ${f.maxLength} karakter (canlı form, DOC-D); aşılırsa ilerleme engellenir. Hata metni belgede yok; prototipteki metin ${q(maxLengthMessage(f.maxLength))}.`);
  }
  const approved = [];
  const pending = [];
  const seen = new Set();
  for (const [, f] of ctx.fieldsById) {
    for (const c of f.checks || []) {
      const key = `${c.req}|${f.id}`;
      if (seen.has(key) || f.removed) continue;
      seen.add(key);
      const st = ctx.statusOf(c.req);
      if (isMandatoryStatus(st)) approved.push([c, f]);
      else if (!isDroppedStatus(st)) pending.push([c, f]);
    }
  }
  if (approved.length) {
    L.push('- Onaylı format doğrulamaları (alan doluysa uygulanır; hata engeller):');
    for (const [c, f] of approved) L.push(`  - ${q(f.label)} — ${CHECKS[c.kind].label} (${c.req}): ${q(CHECKS[c.kind].message)}`);
  } else {
    const kinds = [...new Set(pending.map(([c]) => CHECKS[c.kind].label.toLocaleLowerCase('tr-TR')))].sort();
    L.push(`- Onaylı format doğrulaması yok. Belgelerde alan formatı (${kinds.join(', ') || 'hiçbiri'}) tanımlanmamıştır; onay olmadan format kısıtı ekleme.`);
  }
  if (pending.length) {
    const ids = [...new Set(pending.map(([c]) => c.req))].sort().join(', ');
    L.push(`- Onay bekleyen format önerileri: ${ids} (Bölüm 3.2). Prototipte yalnızca engellemeyen uyarı olarak test edildi. Son üründe onay almadan uygulama.`);
  }
  const pres = behaviorLine(ctx, 'presentation', 'Hata sunumu: alan altında kırmızı mesaj + form/sayfa üstünde hata özeti (her hata ilgili alana bağlantı) + ilk hatalı alana odak');
  if (pres) L.push(`- ${pres}`);
  L.push('- İstemci tarafı doğrulamalar, gerçek gönderim uygulanırsa sunucu tarafında da tekrarlanmalıdır.');
  L.push('');
}

function experience(ctx, L) {
  const { form } = ctx;
  L.push('## 9. Navigasyon, gözden geçirme ve test edilen deneyim akışı', '');
  L.push(
    ctx.fs.experienceConfirmed
      ? 'Aşağıdaki akış prototipte test edildi ve kullanıcı tarafından final olarak onaylandı. Son ürün bu deneyimi birebir sunmalıdır.'
      : 'Aşağıdaki akış prototipte test edilen deneyimdir. Kullanıcı henüz final onayı vermedi; "OPSİYONEL ÖNERİ" işaretli adımlar onay bekler.',
    '',
  );
  const review = behaviorLine(ctx, 'review', '"Gözden geçir" adımı: gönderimden önce tüm yanıtlar bölüm bölüm özetlenir; her bölümde "Düzenle" ile ilgili adıma dönülür, "Gönder" bu adımdadır');
  let step = 1;
  L.push(`${step++}. Üst bilgi bloğu: form başlığı${form.header.intro ? ', giriş metni, "Fatura Süreçleri Hakkında Önemli Bilgilendirme" maddeleri, gizlilik metni' : ''} ve ${q(form.header.requiredLegend)}. ${form.hasBranches ? 'İlk adımda tam gösterilir; sonraki adımlarda yalnızca form başlığı görünür (mevcut Google Forms davranışıyla aynı).' : 'Formun üstünde görünür.'}`);
  if (form.hasBranches) {
    L.push(`${step++}. Adım 0 — Fatura yönü: soru ve iki büyük seçim kartı (${form.branchQuestion.options.map((o) => q(o.label)).join(' / ')}). Bu adım tamamlanmadan diğer adımlar kilitlidir. Seçim yapıldıktan sonraki her adımda seçili yön bir etiketle gösterilir ve "Değiştir" ile Adım 0'a dönülebilir.`);
    if (form.routing) {
      L.push(`${step++}. Form sayfaları ${q(routingLabel(ctx))} yanıtına göre (Bölüm 7.2): ${routeGroups(form).map((g) => `${g.answers.map(q).join(', ')} → ${pathText(ctx, g.path)}`).join(' · ')}. Bu soru yanıtlanana kadar ilerleme göstergesinde "Sonraki sayfalar … yanıtına göre belirlenir" yer tutucusu görünür.`);
    } else {
      L.push(`${step++}. Form sayfaları sırasıyla: ${form.sections.filter((s) => s.kind === 'fields').map(sectionTitle).join(' → ')}.`);
    }
    L.push(`${step++}. Her sayfada üstte adım/ilerleme göstergesi (izlenen yoldaki adım adları ve "Adım X / N"), altta "Geri" ve "Sonraki". "Sonraki" yalnızca o sayfanın doğrulaması geçerse ilerler; "Geri" doğrulama yapmadan döner ve girilen değerler korunur. Daha önce ulaşılmış adımlara ilerleme göstergesinden dönülebilir.`);
  } else {
    L.push(`${step++}. Tek sayfa: tüm alanlar belgedeki sırayla, görsel alt başlıklar altında.`);
    L.push(`${step++}. Sayfa sonundaki birincil düğme tüm zorunlu alanları doğrular; hata varsa ilerlemez.`);
  }
  if (review) L.push(`${step++}. ${review}`);
  L.push(`${step++}. "Formu temizle": tüm yanıtları siler (belgelenmiş eylem). Onay penceresi gösterilmesi belgede yok; prototip onay sorar.`);
  const submitReq = form.hasBranches ? 'C-Q09' : 'T-Q06';
  const st = ctx.statusOf(submitReq);
  const note = ctx.noteOf(submitReq);
  L.push(`${step++}. Gönderim: ${isMandatoryStatus(st) && note ? `karar (${submitReq}): ${note}` : `gönderim hedefi bilinmiyor (${submitReq}, engelleyici). Gerçek kayıt/iletim uygulama; gönderim katmanını tek bir arayüz arkasında yer tutucu olarak bırak.`}`);
  L.push(
    `${step++}. Gönderim sonrası ekran: ${form.confirmation ? `onay mesajı ${q(form.confirmation.text)} (${form.confirmation.req}).` : 'onay mesajı belgede yok (açık soru). Prototip "Gönderim simüle edildi" başlığını kullanır; bu metni ürüne taşıma.'}`,
  );
  L.push('');
}

function approvedChanges(ctx, L) {
  L.push('## 11. İnceleme sürecinden onaylı değişiklikler', '');
  const decisions = ctx.fs.decisions.slice().sort(byId);
  L.push('### 11.1 Onaylı kararlar', '');
  if (!decisions.length) L.push('- Henüz onaylı karar yok.');
  for (const d of decisions) {
    const scope = ctx.form.hasBranches ? ` · Kapsam: ${BRANCH_SCOPES[d.branch || 'all']}` : '';
    L.push(`- [${d.id}] ${d.title || 'Karar'}${scope}${d.target ? ` · Hedef: ${targetLabel(ctx.formId, ctx.state, d.target)}` : ''}`);
    L.push(`  Karar: ${d.text}`);
    const change = decisionChangeText(d, ctx.formId, ctx.state);
    if (change) L.push(`  Yapısal değişiklik: ${change}`);
    if (d.implications) L.push(`  Etki: ${d.implications}`);
    if (d.reqIds && d.reqIds.length) L.push(`  İlgili gereksinimler: ${d.reqIds.join(', ')}`);
    if (d.sourceFeedbackId) L.push(`  Kaynak geri bildirim: ${d.sourceFeedbackId}`);
  }
  L.push('');
  L.push('### 11.2 Test sırasında gereksinim durumu kararları', '');
  const changed = ctx.reqs.filter((r) => r.status !== r.defaultStatus || r.note);
  if (!changed.length) L.push('- Yok (tüm gereksinimler belgedeki varsayılan durumunda).');
  for (const r of changed) {
    L.push(`- [${r.id}] ${STATUS[r.defaultStatus].label} → ${STATUS[r.status].label}${r.note ? ` — Not: ${r.note}` : ''}`);
  }
  L.push('');
  const closed = ctx.fs.feedback.filter((f) => f.status === 'cozuldu' && !f.decisionId).sort(byId);
  L.push('### 11.3 Değişiklik gerektirmeden kapatılan geri bildirimler (bilgi amaçlı)', '');
  if (!closed.length) L.push('- Yok.');
  for (const f of closed) L.push(`- [${f.id}] ${FEEDBACK_CATEGORIES[f.category]} — ${f.description}`);
  L.push('');
}

function feedbackLine(f, ctx) {
  const parts = [FEEDBACK_CATEGORIES[f.category]];
  if (f.priority) parts.push(`öncelik: ${PRIORITIES[f.priority]}`);
  if (ctx.form.hasBranches) parts.push(`branş: ${BRANCH_SCOPES[f.branch || 'all']}`);
  parts.push(`hedef: ${targetLabel(ctx.formId, ctx.state, f.target)}`);
  return `- [${f.id}] (${parts.join(' · ')}) ${f.description}${f.expected ? ` — Beklenen/öneri: ${f.expected}` : ''}`;
}

function unresolved(ctx, L) {
  L.push('## 12. Açık sorular ve uygulama sınırları', '');
  const { ready } = ctx;

    'Kısaca: formu test edin, gördüklerinizi "Not" düğmesiyle kaydedin, bitince sağ üstteki "Final" düğmesine basın. İki form için ayrı geliştirme promptu oluşur; kopyalayabilir veya .txt olarak indirebilirsiniz.',
    'Üstten formu seçin: Cari Form veya Yeni Talent Form. İki formun yanıtları, geri bildirimleri ve kararları birbirinden ayrı tutulur.',
    '"Formu test et" sekmesinde formu doldurun. Cari Form ilk adımda fatura yönünü sorar; seçim kategori seçeneklerini değiştirir.',
    'Sağdaki test notları belgedeki kaynağı, koşulları ve açık soruları gösterir. "Test notlarını göster" ile gizleyip formu sade hâliyle görebilirsiniz.',
    'Her alanın yanındaki "Not" düğmesiyle o alana bağlı geri bildirim kaydedin. Bölüm notu ve "Bu bölümü inceledim" işareti sağ paneldedir.',
    '"Gereksinimler" sekmesinde her maddenin kaynağını görün; durumunu (ör. onayladım, reddedildi, ertelendi) ve karar notunuzu girin. Açık soruları burada cevaplayın.',
    'Bir geri bildirimi uygulamaya karar verdiğinizde "Karara dönüştür" deyin. Geri bildirimler, siz onaylamadan gereksinim sayılmaz. Alan değişikliği içeren kararlar prototipe hemen yansır.',
    '"Prompt hazırlığı" sekmesinde hazırlık durumunu görün, deneyimi final olarak onaylayın ve her form için ayrı promptu oluşturun. Promptu düzenleyebilir, kopyalayabilir veya .txt olarak indirebilirsiniz.',
    'Çalışmanız tarayıcıda otomatik saklanır. Yedek veya paylaşım için "JSON dışa aktar" kullanın; devam etmek için "JSON içe aktar" ile geri yükleyin.',
    'Gerçek kişisel, banka veya vergi verisi girmeyin; "Örnek veri doldur" açıkça işaretli sahte veri kullanır.',
  ];
  openDialog({
    title: 'Nasıl kullanılır?',
    wide: true,
    body: h('ol', { class: 'help-list' }, steps.map((s) => h('li', {}, s))),
    actions: (close) => [button('Kapat', close, { variant: 'primary' })],
  });
}

// --- Başlat ------------------------------------------------------------------

function init() {
  const root = document.getElementById('app');
  const fileInput = h('input', { type: 'file', accept: 'application/json,.json', id: 'import-file', class: 'visually-hidden', 'aria-hidden': 'true', tabindex: '-1' });
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) importReview(fileInput.files[0]);
    fileInput.value = '';
  });
  root.append(
    h(
      'header',
      { class: 'topbar' },
      h('div', { class: 'brand' }, h('h1', {}, 'Muhasebe Formları · Gereksinim Prototipi'), h('p', {}, '1) Formu test edin · 2) "Not" ile kaydedin · 3) Bitince "Final"e basın: iki ayrı prompt oluşur. Gerçek işlem yapılmaz.')),
      h(
        'div',
        { class: 'topbar-actions' },
        button('Nasıl kullanılır?', showHelp, { id: 'btn-help' }),
        button('JSON dışa aktar', exportReview, { id: 'btn-export' }),
        button('JSON içe aktar', () => fileInput.click(), { id: 'btn-import' }),
        button('Final: promptları oluştur', () => runFinal(app), { variant: 'primary', id: 'btn-final' }),
        fileInput,
      ),
    ),
    h('div', { id: 'banner' }),
    h('nav', { id: 'form-switch', class: 'form-switch', 'aria-label': 'Form seçimi' }),
    h('nav', { id: 'tabs', class: 'tabs', role: 'tablist', 'aria-label': 'Bölümler' }),
    h('main', { id: 'main', class: 'main', role: 'tabpanel' }),
  );
  window.addEventListener('beforeunload', () => app.flush());
  app.render();
}

init();

Object.assign(__exports, { app });
});
})();
</script>
