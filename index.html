<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muhasebe Formları Prototipi</title>
    <meta name="description" content="Cari Form ve Yeni Talent Form için gereksinim doğrulama prototipi: formu test edin, not alın, notları JSON olarak indirin" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">İçeriğe geç</a>
    <div id="app" class="app"></div>
    <noscript>Bu prototip JavaScript gerektirir.</noscript>
    <!-- dosya-uyarisi:baslangic -->
    <script>
      // Kaynak sürüm dosyaya çift tıklanarak (file://) açılamaz: tarayıcılar ES modüllerini bu şekilde yüklemez.
      if (location.protocol === 'file:') {
        document.getElementById('app').innerHTML =
          '<div class="banner banner-warn" role="alert" style="margin-top:24px">' +
          '<strong>Bu dosya bu şekilde açılamaz.</strong> Çift tıklayarak açmak için <code>dist/muhasebe-form-prototipi.html</code> dosyasını kullanın ' +
          'ya da proje klasöründe <code>npm start</code> komutunu çalıştırın (ayrıntılar README.md dosyasında).</div>';
      }
    </script>
    <!-- dosya-uyarisi:bitis -->
    <script type="module" src="src/app.js"></script>
  </body>
</html>
